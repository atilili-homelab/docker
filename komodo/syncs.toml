[[server]]
name = "controlplane"
[server.config]
enabled = true

##

[[server]]
name = "dozer"
[server.config]
enabled = true

##

[[server]]
name = "link"
[server.config]
enabled       = true
ignore_mounts = ["/mnt/UNIFIED"]

##

[[server]]
name = "merovingian"
[server.config]
enabled       = true
ignore_mounts = ["/mnt/UNIFIED"]

##

[[server]]
name = "morpheus"
[server.config]
enabled = true

##

[[server]]
name = "mouse"
[server.config]
enabled         = true
send_cpu_alerts = false
send_mem_alerts = false

##

[[server]]
name = "neo"
[server.config]
enabled      = true
mem_warning  = 90.0
mem_critical = 99.0

##

[[server]]
name = "niobe"
[server.config]
enabled = true

