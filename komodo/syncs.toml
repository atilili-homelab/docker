[[repo]]
name = "docker"
[repo.config]
server       = "neo"
git_provider = "forge.macopla.com"
git_account  = "komodo"
repo         = "homelab/docker"

##

[[repo]]
name = "homelab"
[repo.config]
server       = "neo"
git_provider = "gitlab.com"
git_account  = "Atilil"
repo         = "atilili/homelab"

##

[[alerter]]
name = "ntfy"
[alerter.config]
enabled = true
endpoint.type = "Ntfy"
endpoint.params.url = "https://ntfy.macopla.com/Infra?auth=[[ntfy_auth]]"
alert_types = [
    "ServerUnreachable",
    "ServerCpu",
    "ServerMem",
    "ServerDisk",
    "SwarmUnhealthy",
    "StackImageUpdateAvailable",
    "ActionFailed",
    "ProcedureFailed",
    "ResourceSyncPendingUpdates",
    "ContainerStateChange",
    "StackAutoUpdated",
    "StackStateChange",
    "ServerVersionMismatch",
    "DeploymentImageUpdateAvailable",
    "DeploymentAutoUpdated",
    "ScheduleRun",
    "BuildFailed",
    "RepoBuildFailed",
]
maintenance_windows = [
    { name = "Daily updates", description = "Updates automatique ", schedule_type = "Daily", hour = 3, minute = 0, duration_minutes = 60, enabled = true },
]

##

[[builder]]
name = "neo"
[builder.config]
type           = "Server"
params.servers = ["neo"]

##

[[resource_sync]]
name = "global sync"
[resource_sync.config]
linked_repo   = "docker"
resource_path = ["komodo/syncs.toml"]
managed       = true
delete        = true
