run_directory = "stacks/seedbox"
environment = """
WIREGUARD_PRIVATE_KEY=[[seedbox_wg_priv_key]]
"""

##

[[stack]]
name = "semaphore"
[stack.config]
swarm = "Prod Swarm"
poll_for_updates = true
