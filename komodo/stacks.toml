[[stack]]
name        = "authelia"
description = "Services d'authentification et ldap du Homelab"
tags        = ["stack"]
[stack.config]
swarm = "Prod Swarm"
linked_repo = "docker"
run_directory = "authelia"
config_files = [
    { path = "authelia.env", requires = "Redeploy" },
    { path = "lldap.env", requires = "Redeploy" },
]

