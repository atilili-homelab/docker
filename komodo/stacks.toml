swarm = "Prod Swarm"
linked_repo = "homelab"
run_directory = "stacks/recyclarr"
pre_deploy.command = """
cp /data/gluster/recyclarr/recyclarr.yml /data/gluster/recyclarr/recyclarr.yml.bak
cp recyclarr.yml /data/gluster/recyclarr/recyclarr.yml
"""
pre_deploy.shell_mode = false

