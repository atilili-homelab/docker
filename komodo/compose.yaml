x-healthcheck: &healthcheck
    interval: 30s
    timeout: 10s
    start_period: 30s
    retries: 3

services:
    core:
        image: ghcr.io/moghtech/komodo-core:2@sha256:91b2afd7b3bb2abea0ebd3046d65ec457eb1f3d505868d1d60cb0f8562490ef9
        env_file: [./core.env]
        environment: [TZ=Europe/Paris]
        secrets:
        - komodo_db_password
        - komodo_oidc_client_secret
        - komodo_webhook_secret
        - komodo_private_key
        networks: [komodo-net, traefik-public]
        healthcheck:
            !!merge <<: *healthcheck
            test: curl -f http://127.0.0.1:9120 || exit 1
        deploy:
            # Sans état exclusif : le nouveau Core démarre avant l'arrêt de l'ancien
            update_config: {delay: 10s, failure_action: rollback, order: start-first}
            restart_policy: {delay: 10s, window: 120s}
            placement: {constraints: [node.labels.tier == infra]}
            resources: {limits: {memory: 512M}}
            labels:
            - traefik.enable=true
            - traefik.http.routers.komodo.rule=Host(`komodo.macopla.com`) && !PathPrefix(`/listener/`)
            - traefik.http.routers.komodo.entrypoints=websecure
            - traefik.http.services.komodo.loadbalancer.server.port=9120
            - traefik.http.routers.komodo.middlewares=local-only@file
            - traefik.http.routers.komodo-webhooks.rule=Host(`komodo.macopla.com`) && PathPrefix(`/listener/`)
            - traefik.http.routers.komodo-webhooks.entrypoints=websecure
            - traefik.http.routers.komodo-webhooks.service=komodo

    mongo:
        image: mongo:9.0.4@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058
        labels: [komodo.skip]
        command: --quiet --wiredTigerCacheSizeGB 0.25
        volumes: ['komodo_db:/data/db']
        environment:
        - MONGO_INITDB_ROOT_USERNAME=komodo
        - MONGO_INITDB_ROOT_PASSWORD_FILE=/run/secrets/komodo_db_password
        secrets: [komodo_db_password]
        networks: [komodo-net]
        healthcheck:
            !!merge <<: *healthcheck
            test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
        deploy:
            update_config: {delay: 10s, failure_action: rollback, order: stop-first}
            restart_policy: {delay: 10s, window: 120s}
            placement: {constraints: [node.labels.tier == database]}
            resources: {limits: {memory: 512M}}

volumes:
    komodo_db: {driver_opts: {type: none, o: bind, device: /data/komodo/db}}

secrets:
    komodo_db_password: {external: true}
    komodo_oidc_client_secret: {external: true}
    komodo_webhook_secret: {external: true}
    komodo_private_key: {external: true}

networks:
    komodo-net: {driver: overlay}
    traefik-public: {external: true}
