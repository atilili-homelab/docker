services:
    core:
        image: moghtech/komodo-core:2@sha256:91b2afd7b3bb2abea0ebd3046d65ec457eb1f3d505868d1d60cb0f8562490ef9
        env_file: [./core.env]
        environment: {TZ: Europe/Paris}
        secrets:
        - komodo_db_password
        - komodo_oidc_client_secret
        - komodo_webhook_secret
        - komodo_private_key
        networks: [komodo-net, traefik-lan]
        healthcheck: {test: curl -f http://127.0.0.1:9120 || exit 1, timeout: 10s, start_period: 30s}
        deploy:
            update_config: {failure_action: rollback, order: start-first}
            restart_policy: {delay: 10s}
            placement: {constraints: [node.labels.tier == infra]}
            resources: {limits: {memory: 512M}}
            labels:
                traefik.enable: 'true'
                traefik.swarm.network: traefik-lan
                traefik.http.services.komodo.loadbalancer.server.port: 9120
                traefik.http.routers.komodo.rule: Host(`komodo.macopla.com`) && !PathPrefix(`/listener/`)
                traefik.http.routers.komodo.middlewares: lan@file
                traefik.http.routers.komodo-webhooks.rule: Host(`komodo.macopla.com`) && PathPrefix(`/listener/`)
                traefik.http.routers.komodo-webhooks.service: komodo

    mongo:
        image: mongo:9.0.8@sha256:b0c835c26e5997413e985000f1013c275377cd9607761c1784d486f6dd620b7f
        labels:
            komodo.skip: ''
            backup.db.engine: mongodb
            backup.db.user: komodo
            backup.db.name: komodo
            backup.db.database: komodo
            backup.db.auth_database: admin
        command: --quiet --wiredTigerCacheSizeGB 0.25
        volumes: ['komodo_db:/data/db']
        environment:
            MONGO_INITDB_ROOT_USERNAME: komodo
            MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/komodo_db_password
        secrets: [komodo_db_password]
        networks: [komodo-net]
        healthcheck:
            test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
            timeout: 10s
            start_period: 30s
        deploy:
            update_config: {failure_action: rollback, order: stop-first}
            restart_policy: {delay: 10s}
            placement: {constraints: [node.labels.tier == database]}
            resources: {limits: {memory: 512M}}

volumes:
    komodo_db: {driver_opts: {type: none, o: bind, device: /data/komodo/db}}

secrets:
    komodo_db_password: {name: komodo_db_password_v1, external: true}
    komodo_oidc_client_secret: {name: komodo_oidc_client_secret_v1, external: true}
    komodo_webhook_secret: {name: komodo_webhook_secret_v1, external: true}
    komodo_private_key: {name: komodo_private_key_v1, external: true}

networks:
    komodo-net: {driver: overlay}
    traefik-lan: {external: true}
