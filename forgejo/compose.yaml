services:
    forgejo:
        image: codeberg.org/forgejo/forgejo:17-rootless@sha256:5ef02fbcf22beef56b8c844952ffad58cfe177b6f98e46e6abb5df90b88dc8d3
        restart: unless-stopped
        user: 1000:1000
        env_file: [./forgejo.env]
        networks: [proxy]
        volumes: ['forgejo-data:/var/lib/gitea', '/etc/localtime:/etc/localtime:ro']
        ports: ['10.86.99.6:2222:2222']
        security_opt: ['no-new-privileges:true']
        deploy: {resources: {limits: {memory: 1G}}}

volumes:
    forgejo-data: {driver_opts: {type: none, o: bind, device: /data/forgejo/data}}
networks:
    proxy: {external: true}
