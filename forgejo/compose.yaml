services:
    forgejo:
        image: codeberg.org/forgejo/forgejo:16-rootless@sha256:85c09de612c60347d3d44582ca8cb32e7ac46309a544e35b2cb27dad2e5ad5bd
        restart: unless-stopped
        user: 1000:1000
        env_file: [./forgejo.env]
        networks: [proxy]
        volumes: ['forgejo-data:/var/lib/gitea', '/etc/localtime:/etc/localtime:ro']
        ports: ['10.86.99.6:2222:2222']
        security_opt: ['no-new-privileges:true']
        deploy: {resources: {limits: {memory: 1G}}}

volumes:
    forgejo-data: {driver_opts: {type: none, o: bind, device: /data/forgejo/data}}
networks:
    proxy: {external: true}
