services:
    forgejo:
        image: codeberg.org/forgejo/forgejo:17-rootless@sha256:39362ab93a94c0c9b8b330d2a877ddbb3f02fa8c0cba1b8d686d437b39f36a04
        restart: unless-stopped
        user: 1000:1000
        env_file: [./forgejo.env]
        networks: [proxy]
        volumes: ['forgejo-data:/var/lib/gitea', '/etc/localtime:/etc/localtime:ro']
        ports: ['10.86.99.6:2222:2222']
        security_opt: ['no-new-privileges:true']
        deploy: {resources: {limits: {memory: 1G}}}

volumes:
    forgejo-data: {driver_opts: {type: none, o: bind, device: /data/forgejo/data}}
networks:
    proxy: {external: true}
