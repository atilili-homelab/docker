services:
    socket-proxy:
        image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
        volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
        environment:
        - TZ=Europe/Paris
        - NETWORKS=1
        - SERVICES=1
        - TASKS=1
        - NODES=1
        - CONTAINERS=1
        - INFO=1
        - SWARM=1
        networks:
            socket-proxy:
                aliases:
                - socket-proxy
        healthcheck:
            test: wget --no-verbose --tries=1 --spider http://127.0.0.1:2375/version || exit 1
            interval: 30s
            timeout: 5s
            start_period: 5s
            retries: 3
        deploy:
            mode: global
            update_config:
                parallelism: 1
                delay: 10s
                failure_action: rollback
                order: stop-first
            rollback_config:
                parallelism: 1
            restart_policy:
                condition: any
                delay: 10s
                max_attempts: 0
                window: 120s
            resources:
                limits:
                    memory: 32M
            placement:
                constraints:
                - node.role == manager

    traefik:
        image: traefik:v3.7@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
        command:
        # HTTP Entrypoint
        - --entrypoints.web.address=:80
        # Redirection HTTP -> HTTPS
        - --entrypoints.web.http.redirections.entrypoint.to=websecure
        - --entrypoints.web.http.redirections.entrypoint.scheme=https
        - --entrypoints.web.http.redirections.entrypoint.permanent=true
        # HTTPS Entrypoint
        - --entrypoints.websecure.address=:443
        - --entrypoints.websecure.asDefault=true
        # Config ACME (Let's Encrypt)
        - --certificatesresolvers.letsencrypt.acme.email=admin@macopla.com
        - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
        - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
        - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
        - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
        # Certificat wildcard par défaut
        - --entrypoints.websecure.http.tls.certresolver=letsencrypt
        - --entrypoints.websecure.http.tls.domains[0].main=macopla.com
        - --entrypoints.websecure.http.tls.domains[0].sans=*.macopla.com
        # Config Swarm
        - --providers.swarm.endpoint=tcp://socket-proxy:2375
        - --providers.swarm.watch=true
        - --providers.swarm.exposedByDefault=false
        - --providers.swarm.network=traefik-public
        - --providers.file.directory=/dynamic
        - --providers.file.watch=true
        # Config Logs
        - --log.level=INFO
        - --accesslog=true
        # Config API & Dashboard
        - --api.dashboard=true
        - --api.insecure=false
        # Metric Prometheus
        - --entrypoints.metrics.address=:8082
        - --metrics.prometheus=true
        - --metrics.prometheus.entrypoint=metrics
        - --metrics.prometheus.addRoutersLabels=true
        # Plugins crowdsec
        - --experimental.plugins.crowdsec-bouncer-traefik-plugin.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
        - --experimental.plugins.crowdsec-bouncer-traefik-plugin.version=v1.6.0
        - --entrypoints.websecure.http.middlewares=crowdsec@file
        # Ping (healthcheck)
        - --ping=true
        volumes:
        - /data/gluster/traefik:/letsencrypt
        configs:
        - source: middlewares
          target: /dynamic/middlewares.yml
        - source: external
          target: /dynamic/external.yml
        secrets:
        - cloudflare_api_token
        - traefik_crowdsec_lapi_key
        environment:
        - TZ=Europe/Paris
        - CF_DNS_API_TOKEN_FILE=/run/secrets/cloudflare_api_token
        ports:
        - target: 80
          published: 80
          protocol: tcp
          mode: host
        - target: 443
          published: 443
          protocol: tcp
          mode: host
        networks:
        - socket-proxy
        - traefik-public
        - net-security
        healthcheck:
            test: traefik healthcheck --ping
            interval: 15s
            timeout: 5s
            start_period: 10s
            retries: 3
        deploy:
            mode: global
            update_config:
                parallelism: 1
                delay: 10s
                failure_action: rollback
                order: stop-first
            rollback_config:
                parallelism: 1
            restart_policy:
                condition: any
                delay: 10s
                max_attempts: 0
                window: 120s
            resources:
                limits:
                    memory: 256M
            placement:
                constraints:
                - node.labels.traefik == true

networks:
    socket-proxy:
        external: true
    traefik-public:
        external: true
    net-security:
        external: true

configs:
    middlewares:
        name: traefik_middlewares_v1
        file: ./middlewares.yml
    external:
        name: traefik_external_v1
        file: ./external.yml

secrets:
    cloudflare_api_token:
        external: true
    traefik_crowdsec_lapi_key:
        external: true
