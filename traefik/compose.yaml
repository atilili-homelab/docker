x-healthcheck: &healthcheck {interval: 15s, timeout: 5s, start_period: 10s}

services:
    socket-proxy:
        image: linuxserver/socket-proxy:3.4.7-r0-ls105@sha256:823dda971e9a3951257eb251586a804199819fe1587c35faa43adc7b52a2ff16
        volumes: ['/var/run/docker.sock:/var/run/docker.sock:ro', {type: tmpfs, target: /run}]
        environment:
            TZ: Europe/Paris
            NETWORKS: 1
            NODES: 1
            SERVICES: 1
            TASKS: 1
            EVENTS: 0
        read_only: true
        networks: [traefik-proxy]
        healthcheck:
            !!merge <<: *healthcheck
            test: wget --no-verbose --tries=1 --spider http://127.0.0.1:2375/version || exit 1
        deploy:
            mode: global
            update_config: {delay: 10s, failure_action: rollback, order: stop-first}
            restart_policy: {delay: 10s}
            resources: {limits: {memory: 32M}}
            placement: {constraints: [node.role == manager]}

    traefik:
        image: traefik:v3.7@sha256:b7b1b31e6440de0b1f7c4e0f6cf0a0f3f004866761d30c025fe00c80daaf7d9c
        volumes: ['letsencrypt:/letsencrypt']
        environment:
            TZ: Europe/Paris
            CF_DNS_API_TOKEN_FILE: /run/secrets/traefik_cloudflare_api_token
        configs:
        - {source: middlewares, target: /dynamic/middlewares.yml}
        - {source: external, target: /dynamic/external.yml}
        - {source: static, target: /etc/traefik/traefik.yml}
        secrets: [traefik_cloudflare_api_token, {source: crowdsec_bouncer_key_traefik, target: traefik_crowdsec_lapi_key}]
        ports:
        - {target: 80, published: 80, mode: host}
        - {target: 443, published: 443, mode: host}
        networks: [traefik-proxy, traefik-lan, traefik-wan, crowdsec-bouncer]
        healthcheck: {!!merge <<: *healthcheck, test: traefik healthcheck --ping}
        deploy:
            mode: global
            update_config: {delay: 10s, failure_action: rollback, order: stop-first}
            restart_policy: {delay: 10s}
            resources: {limits: {memory: 256M}}
            placement: {constraints: [node.labels.traefik == true]}

volumes:
    letsencrypt: {}

networks:
    traefik-lan: {name: traefik-lan, driver: overlay}
    traefik-wan: {name: traefik-wan, driver: overlay}
    traefik-proxy: {driver: overlay}
    crowdsec-bouncer: {external: true}

configs:
    middlewares: {name: traefik_middlewares_v4, file: ./middlewares.yml}
    external: {name: traefik_external_v3, file: ./external.yml}
    static: {name: traefik_static_v2, file: ./traefik.yml}

secrets:
    traefik_cloudflare_api_token: {name: traefik_cloudflare_api_token_v1, external: true}
    crowdsec_bouncer_key_traefik: {name: crowdsec_bouncer_key_traefik_v1, external: true}
