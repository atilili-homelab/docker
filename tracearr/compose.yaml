services:
    tracearr:
        image: ghcr.io/connorgallopo/tracearr:3.2.1@sha256:6bcaf17c012b4fe11b898f343244af19b3c87b7847bdc652897e2c9781465f2c
        entrypoint: [/file-env.sh, /entrypoint.sh]
        command: [node, apps/server/dist/index.js]
        environment:
            TZ: Europe/Paris
            LOG_LEVEL: info
            DATABASE_URL_FILE: /run/configs/tracearr_db_url
            REDIS_URL: redis://tracearr-redis:6379
            REDIS_PREFIX: tracearr
            JWT_SECRET_FILE: /run/secrets/tracearr_jwt_secret
            COOKIE_SECRET_FILE: /run/secrets/tracearr_cookie_secret
            CORS_ORIGIN: https://tracearr.macopla.com
            OIDC_ISSUER_URL: https://sso.macopla.com
            OIDC_CLIENT_ID: tracearr
            OIDC_CLIENT_SECRET_FILE: /run/secrets/tracearr_oidc_client_secret
            OIDC_PROVIDER_NAME: Macopla-SSO
            TRUST_PROXY: '1'
        volumes: ['tracearr_data:/data/tracearr', 'tracearr_backup:/data/backup']
        configs:
        - {source: tracearr_db_url, target: /run/configs/tracearr_db_url}
        - {source: file_env, target: /file-env.sh, mode: 0555}
        secrets: [tracearr_db_password, tracearr_jwt_secret, tracearr_cookie_secret, tracearr_oidc_client_secret]
        networks: [traefik-wan, tracearr-net]
        healthcheck: {test: wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1, timeout: 10s, start_period: 30s}
        deploy:
            update_config: {failure_action: rollback, order: stop-first}
            restart_policy: {delay: 10s}
            placement: {constraints: [node.labels.tier == media]}
            resources: {limits: {memory: 512M}}
            labels:
                traefik.enable: 'true'
                traefik.swarm.network: traefik-wan
                traefik.http.routers.tracearr.rule: Host(`tracearr.macopla.com`)
                traefik.http.services.tracearr.loadbalancer.server.port: 3000

    tracearr-db:
        image: timescale/timescaledb-ha:pg18.3-ts2.26.1@sha256:8bc847c61ebbf7333c219565fd3546c78f1f30597e31bda17a720078929d7a0d
        labels: {backup.db.engine: postgres, backup.db.user: tracearr}
        command: postgres -c timescaledb.max_tuples_decompressed_per_dml_transaction=0 -c max_locks_per_transaction=4096
        environment:
            POSTGRES_USER: tracearr
            POSTGRES_DB: tracearr
            POSTGRES_PASSWORD_FILE: /run/secrets/tracearr_db_password
            PGDATA: /home/postgres/pgdata/data
        secrets: [tracearr_db_password]
        volumes: ['tracearr_db:/home/postgres/pgdata/data']
        networks: [tracearr-net]
        deploy:
            update_config: {failure_action: rollback, order: stop-first}
            restart_policy: {delay: 10s}
            placement: {constraints: [node.labels.tier == database]}
            resources: {limits: {memory: 1G}}
        healthcheck: {test: [CMD-SHELL, 'pg_isready -U tracearr -d tracearr'], timeout: 10s, start_period: 30s}

    tracearr-redis:
        image: redis:8-alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
        command: redis-server --appendonly yes
        volumes: ['tracearr_redis:/data']
        networks: [tracearr-net]
        deploy:
            update_config: {failure_action: rollback, order: stop-first}
            restart_policy: {delay: 10s}
            placement: {constraints: [node.labels.tier == database]}
            resources: {limits: {memory: 256M}}
        healthcheck: {test: [CMD-SHELL, 'redis-cli ping | grep -q PONG'], timeout: 10s, start_period: 30s}

volumes:
    tracearr_data: {driver_opts: {type: none, o: bind, device: /data/tracearr/data}}
    tracearr_backup: {driver_opts: {type: none, o: bind, device: /data/tracearr/backups}}
    tracearr_db: {driver_opts: {type: none, o: bind, device: /data/tracearr/db}}
    tracearr_redis: {driver_opts: {type: none, o: bind, device: /data/tracearr/redis}}

configs:
    tracearr_db_url: {name: tracearr_db_url_v1, file: ./database_url.tmpl, template_driver: golang}
    file_env: {name: tracearr_file_env_v1, file: ../_shared/file-env.sh}

secrets:
    tracearr_db_password: {name: tracearr_db_password_v1, external: true}
    tracearr_jwt_secret: {name: tracearr_jwt_secret_v1, external: true}
    tracearr_cookie_secret: {name: tracearr_cookie_secret_v1, external: true}
    tracearr_oidc_client_secret: {name: tracearr_oidc_client_secret_v1, external: true}

networks:
    traefik-wan: {external: true}
    tracearr-net: {driver: overlay}
