---
###############################################################################
##                           Authelia Configuration                          ##
###############################################################################
server:
  address: tcp://:9091
  asset_path: /config/assets/
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth
        authn_strategies:
          - name: CookieSession

log:
  level: info

theme: auto

password_policy:
  standard:
    enabled: true
    min_length: 12

authentication_backend:
  ldap:
    implementation: lldap
    address: ldap://authelia_lldap:3890
    base_dn: dc=macopla,dc=com
    user: uid=authelia,ou=people,dc=macopla,dc=com

session:
  cookies:
    - domain: macopla.com
      authelia_url: https://sso.macopla.com

storage:
  postgres:
    address: tcp://authelia_postgres:5432
    database: authelia
    username: authelia

notifier:
  template_path: /config/templates/
  smtp:
    subject: "[Macopla] {title}"
    address: submission://mail.macopla.com:587
    username: noreply@macopla.com
    sender: "Macopla SSO <noreply@macopla.com>"

access_control:
  default_policy: deny
  rules:
    - domain: "*.macopla.com"
      policy: two_factor

totp:
  issuer: macopla.com

webauthn:
  display_name: Macopla SSO
  enable_passkey_login: true
  experimental_enable_passkey_uv_two_factors: true
  selection_criteria:
    user_verification: required

identity_providers:
  oidc:
    authorization_policies:
      admins:
        default_policy: deny
        rules:
          - policy: two_factor
            subject: "group:admins"
      family_only:
        default_policy: deny
        rules:
          - policy: two_factor
            subject: ["group:admins", "group:famille"]
      family_friends:
        default_policy: deny
        rules:
          - policy: two_factor
            subject: ["group:admins", "group:famille"]
          - policy: one_factor
            subject: "group:friends"

    jwks:
      - key_id: main
        # prettier-ignore
        key: {{secret "/run/secrets/authelia_oidc_jwks_key" | mindent 10 "|" | msquote}}
    clients:
      # BOOKSTACK
      - client_id: bookstack
        client_name: Bookstack
        client_secret: "$pbkdf2-sha512$310000$URwYQaGFEHT/tcti0IYbnw$Xi.2uVTajZoqYJswNkigiury25rkNIheAXqd5ui.PbQfmybmzu4xfgiS5XmZZfiErrqlPVNaeVZ90evcdzhhHA"
        authorization_policy: "family_friends"
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://wiki.macopla.com/oidc/callback

      # FORGEJO
      - client_id: forgejo
        client_name: Forgejo
        client_secret: "$pbkdf2-sha512$310000$Ze1/C2GjijY2jja6LoVIow$WVmtPbFVvbrSpP58Tf2v3XmRkAi247NtI8aJn9nKYJjBtkAOVn7jiTXPm.6.J.R/bNK5eJmomNrJLQG9nLMM1w"
        authorization_policy: "admins"
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://forge.macopla.com/user/oauth2/authelia/callback
        scopes:
          - openid
          - profile
          - email

      # IMMICH
      - client_id: immich
        client_name: Immich
        client_secret: "$pbkdf2-sha512$310000$iLjtT/kKbVgA74WhGyOGPA$vROnohRly7QhzRREel8TLsiURAruVapGJT0HgJgUfSre45uh2HDeHdzwlG6RSAkE2jqessUGXSXaFWPXpT65.g"
        authorization_policy: "family_only"
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://photo.macopla.com/auth/login
          - https://photo.macopla.com/user-settings
          - app.immich:///oauth-callback
        scopes:
          - openid
          - profile
          - email

      # KOMODO
      - client_id: komodo
        client_name: Komodo
        client_secret: "$pbkdf2-sha512$310000$PJCVtk8xLKyREjB1tEytLA$MwowVdpooyD.LPcWodAvwO5OjdsAHi9w1Z2xE9BbohRGiqlFfya42eu2UDYJ4BMlv1GIJ4F4ExyrzTGo64C5xw"
        authorization_policy: "admins"
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://komodo.macopla.com/auth/oidc/callback
        scopes:
          - openid
          - profile
          - email
