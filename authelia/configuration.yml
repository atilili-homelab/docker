---
###############################################################################
##                           Authelia Configuration                          ##
###############################################################################
server:
  address: tcp://:9091
  endpoint:
    authz:
      forward-auth:
        implementation: ForwardAuth
        authn_strategies:
          - name: CookieSession

log:
  level: info

authentication_backend:
  ldap:
    implementation: lldap
    address: ldap://authelia_lldap:3890
    base_dn: dc=macopla,dc=com
    user: uid=authelia,ou=people,dc=macopla,dc=com

session:
  cookies:
    - domain: macopla.com
      authelia_url: https://sso.macopla.com

storage:
  postgres:
    address: tcp://authelia_postgres:5432
    database: authelia
    username: authelia

notifier:
  smtp:
    address: submission://mail.macopla.com:587
    username: noreply@macopla.com
    sender: "Macopla SSO <noreply@macopla.com>"

access_control:
  default_policy: deny
  rules:
    - domain: "*.macopla.com"
      policy: two_factor

totp:
  issuer: macopla.com

webauthn:
  display_name: Macopla SSO
  enable_passkey_login: true
  experimental_enable_passkey_uv_two_factors: true
  selection_criteria:
    user_verification: required
