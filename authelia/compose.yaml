services:
    postgres:
        image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        environment:
        - POSTGRES_PASSWORD_FILE=/run/secrets/authelia_postgres_password
        secrets:
        - authelia_postgres_password
        - authelia_db_password
        - lldap_db_password
        configs:
        - source: initdb
          target: /docker-entrypoint-initdb.d/initdb.sh
        volumes:
        - type: volume
          source: postgres
          target: /var/lib/postgresql
        networks:
        - authelia-net
        deploy:
            replicas: 1
            placement:
                constraints:
                - node.labels.tier == database
            update_config:
                parallelism: 1
                order: stop-first
                failure_action: rollback
            rollback_config:
                parallelism: 1
            restart_policy:
                condition: any
                delay: 30s
                window: 300s
            resources:
                limits:
                    memory: 320M
        healthcheck:
            test:
            - 'CMD-SHELL'
            - 'pg_isready -U postgres'
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

configs:
    initdb:
        name: authelia_initdb_v1
        file: ./initdb.sh

secrets:
    authelia_postgres_password:
        external: true
    authelia_db_password:
        external: true
    lldap_db_password:
        external: true

volumes:
    postgres:
        driver_opts:
            type: none
            o: bind
            device: /data/authelia/db

networks:
    authelia-net:
        driver: overlay
