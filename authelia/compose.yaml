services:
    lldap:
        image: lldap/lldap:v0.6.3
        entrypoint:
        - 'tini'
        - '--'
        - '/bin/sh'
        - '-c'
        - 'export PGPASSWORD="$$(cat /run/secrets/lldap_db_password)" && exec /docker-entrypoint.sh "$$@"'
        - 'sh'
        command:
        - 'run'
        - '--config-file'
        - '/data/lldap_config.toml'
        env_file:
        - ./lldap.env
        environment:
        - TZ=${TZ:?}
        secrets:
        - lldap_db_password
        - lldap_jwt_secret
        - lldap_key_seed
        - lldap_admin_password
        networks:
        - authelia-net
        - traefik-lan
        deploy:
            labels:
            - traefik.enable=true
            - traefik.swarm.network=traefik-lan
            - traefik.http.routers.lldap.rule=Host(`ldap.macopla.com`)
            - traefik.http.routers.lldap.middlewares=lan@file
            - traefik.http.services.lldap.loadbalancer.server.port=17170
            replicas: 1
            placement:
                constraints:
                - node.labels.tier == infra
            update_config:
                parallelism: 1
                order: stop-first
                failure_action: rollback
            rollback_config:
                parallelism: 1
            restart_policy:
                condition: any
                delay: 10s
                window: 120s
            resources:
                limits:
                    memory: 128M
        healthcheck:
            test:
            - 'CMD'
            - '/app/lldap'
            - 'healthcheck'
            - '--config-file'
            - '/data/lldap_config.toml'
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

    postgres:
        image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        environment:
        - POSTGRES_PASSWORD_FILE=/run/secrets/authelia_postgres_password
        secrets:
        - authelia_postgres_password
        - authelia_db_password
        - lldap_db_password
        configs:
        - source: initdb
          target: /docker-entrypoint-initdb.d/initdb.sh
        volumes:
        - type: volume
          source: postgres
          target: /var/lib/postgresql
        networks:
        - authelia-net
        deploy:
            replicas: 1
            placement:
                constraints:
                - node.labels.tier == database
            update_config:
                parallelism: 1
                order: stop-first
                failure_action: rollback
            rollback_config:
                parallelism: 1
            restart_policy:
                condition: any
                delay: 30s
                window: 300s
            resources:
                limits:
                    memory: 320M
        healthcheck:
            test:
            - 'CMD-SHELL'
            - 'pg_isready -U postgres'
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

configs:
    initdb:
        name: authelia_initdb_v1
        file: ./initdb.sh

secrets:
    authelia_postgres_password:
        external: true
    authelia_db_password:
        external: true
    lldap_db_password:
        external: true
    lldap_jwt_secret:
        external: true
    lldap_key_seed:
        external: true
    lldap_admin_password:
        external: true

volumes:
    postgres:
        driver_opts:
            type: none
            o: bind
            device: /data/authelia/db

networks:
    authelia-net:
        driver: overlay
    traefik-lan:
        external: true
