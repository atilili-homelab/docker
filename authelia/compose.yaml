services:
    authelia:
        image: authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
        user: 1000:1000
        env_file:
        - ./authelia.env
        environment:
        - TZ=${TZ:?}
        configs:
        - source: configuration
          target: /config/configuration.yml
        secrets:
        - authelia_reset_password_jwt_secret
        - authelia_session_secret
        - authelia_storage_encryption_key
        - authelia_db_password
        - authelia_ldap_password
        - authelia_smtp_password
        - authelia_oidc_jwks_key
        - authelia_oidc_hmac_secret
        networks:
        - authelia-net
        - traefik-wan
        deploy:
            labels:
            - traefik.enable=true
            - traefik.swarm.network=traefik-wan
            - traefik.http.routers.authelia.rule=Host(`sso.macopla.com`)
            - traefik.http.services.authelia.loadbalancer.server.port=9091
            replicas: 1
            placement:
                constraints:
                - node.labels.tier == infra
            update_config:
                parallelism: 1
                order: stop-first
                failure_action: rollback
            rollback_config:
                parallelism: 1
            restart_policy:
                condition: any
                delay: 10s
                window: 120s
            resources:
                limits:
                    memory: 256M
        healthcheck:
            test:
            - 'CMD'
            - '/app/healthcheck.sh'
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

    lldap:
        image: lldap/lldap:v0.6.3@sha256:2a8454b668c1aba7157e832eab0e242e1e7eb5fb7591d7e7774ba05286511ca8
        entrypoint:
        - 'tini'
        - '--'
        - '/bin/sh'
        - '-c'
        - 'export PGPASSWORD="$$(cat /run/secrets/lldap_db_password)" && exec /docker-entrypoint.sh "$$@"'
        - 'sh'
        command:
        - 'run'
        - '--config-file'
        - '/data/lldap_config.toml'
        env_file:
        - ./lldap.env
        environment:
        - TZ=${TZ:?}
        secrets:
        - lldap_db_password
        - lldap_jwt_secret
        - lldap_key_seed
        - lldap_admin_password
        networks:
        - authelia-net
        - traefik-lan
        deploy:
            labels:
            - traefik.enable=true
            - traefik.swarm.network=traefik-lan
            - traefik.http.routers.lldap.rule=Host(`ldap.macopla.com`)
            - traefik.http.routers.lldap.middlewares=lan@file
            - traefik.http.services.lldap.loadbalancer.server.port=17170
            replicas: 1
            placement:
                constraints:
                - node.labels.tier == infra
            update_config:
                parallelism: 1
                order: stop-first
                failure_action: rollback
            rollback_config:
                parallelism: 1
            restart_policy:
                condition: any
                delay: 10s
                window: 120s
            resources:
                limits:
                    memory: 128M
        healthcheck:
            test:
            - 'CMD'
            - '/app/lldap'
            - 'healthcheck'
            - '--config-file'
            - '/data/lldap_config.toml'
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

    postgres:
        image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        environment:
        - POSTGRES_PASSWORD_FILE=/run/secrets/authelia_postgres_password
        secrets:
        - authelia_postgres_password
        - authelia_db_password
        - lldap_db_password
        configs:
        - source: initdb
          target: /docker-entrypoint-initdb.d/initdb.sh
        volumes:
        - type: volume
          source: postgres
          target: /var/lib/postgresql
        networks:
        - authelia-net
        deploy:
            replicas: 1
            placement:
                constraints:
                - node.labels.tier == database
            update_config:
                parallelism: 1
                order: stop-first
                failure_action: rollback
            rollback_config:
                parallelism: 1
            restart_policy:
                condition: any
                delay: 30s
                window: 300s
            resources:
                limits:
                    memory: 320M
        healthcheck:
            test:
            - 'CMD-SHELL'
            - 'pg_isready -U postgres'
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

configs:
    initdb:
        name: authelia_initdb_v1
        file: ./initdb.sh
    configuration:
        name: authelia_configuration_v5
        file: ./configuration.yml

secrets:
    authelia_postgres_password:
        external: true
    authelia_db_password:
        external: true
    authelia_ldap_password:
        external: true
    authelia_reset_password_jwt_secret:
        external: true
    authelia_session_secret:
        external: true
    authelia_storage_encryption_key:
        external: true
    authelia_smtp_password:
        external: true
    authelia_oidc_jwks_key:
        external: true
    authelia_oidc_hmac_secret:
        external: true
    lldap_db_password:
        external: true
    lldap_jwt_secret:
        external: true
    lldap_key_seed:
        external: true
    lldap_admin_password:
        external: true

volumes:
    postgres:
        driver_opts:
            type: none
            o: bind
            device: /data/authelia/db

networks:
    authelia-net:
        driver: overlay
    traefik-lan:
        external: true
    traefik-wan:
        external: true
