services:
    socket-proxy:
        image: linuxserver/socket-proxy:3.4.7-r0-ls105@sha256:823dda971e9a3951257eb251586a804199819fe1587c35faa43adc7b52a2ff16
        volumes: ['/var/run/docker.sock:/var/run/docker.sock:ro', {type: tmpfs, target: /run}]
        environment:
            TZ: Europe/Paris
            CONTAINERS: 1
            SERVICES: 1
            INFO: 1
        read_only: true
        networks: [crowdsec-proxy]
        healthcheck:
            test: wget --no-verbose --tries=1 --spider http://127.0.0.1:2375/version || exit 1
            timeout: 5s
            start_period: 30s
        deploy:
            mode: global
            update_config: {failure_action: rollback, order: stop-first, delay: 10s}
            restart_policy: {delay: 10s}
            resources: {limits: {memory: 32M}}
            placement: {constraints: [node.role == manager]}

    crowdsec:
        image: crowdsecurity/crowdsec:v1.8.2@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4
        entrypoint: [/waitfor.sh, 'crowdsec-db:5432', --, /file-env.sh, /bin/bash, /docker_start.sh]
        environment:
            TZ: Europe/Paris
            DOCKER_HOST: tcp://socket-proxy:2375
            COLLECTIONS: >-
                crowdsecurity/traefik
                crowdsecurity/linux
                crowdsecurity/appsec-virtual-patching
                crowdsecurity/appsec-generic-rules
                LePresidente/authelia
            CROWDSEC_BYPASS_DB_VOLUME_CHECK: 'true'
            DB_PASSWORD_FILE: /run/secrets/crowdsec_db_password
        volumes: ['config:/etc/crowdsec', 'data:/var/lib/crowdsec/data']
        configs:
        - {source: file_env, target: /file-env.sh, mode: 0555}
        - {source: waitfor, target: /waitfor.sh, mode: 0555}
        - {source: config_local, target: /etc/crowdsec/config.yaml.local}
        - {source: acquis, target: /etc/crowdsec/acquis.yaml}
        - {source: appsec, target: /etc/crowdsec/acquis.d/appsec.yaml}
        - {source: profiles, target: /etc/crowdsec/profiles.yaml}
        - {source: notification_http, target: /etc/crowdsec/notifications/http.yaml}
        - {source: console, target: /etc/crowdsec/console.yaml}
        secrets: [crowdsec_db_password, {source: crowdsec_bouncer_key_traefik, target: bouncer_key_traefik}]
        networks: [crowdsec-net, crowdsec-proxy, crowdsec-bouncer]
        deploy:
            update_config: {failure_action: rollback, order: stop-first}
            restart_policy: {delay: 10s}
            placement: {constraints: [node.labels.tier == infra]}
            resources: {limits: {memory: 320M}}
        healthcheck: {test: [CMD, cscli, lapi, status], timeout: 5s, start_period: 30s}

    crowdsec-db:
        image: postgres:18.7-trixie@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
        labels: {backup.db.engine: postgres, backup.db.user: crowdsec}
        command: [postgres, -c, 'timezone=Europe/Paris', -c, 'log_timezone=Europe/Paris']
        environment:
            POSTGRES_USER: crowdsec
            POSTGRES_DB: crowdsec
            POSTGRES_PASSWORD_FILE: /run/secrets/crowdsec_db_password
        volumes: ['crowdsec_db:/var/lib/postgresql']
        secrets: [crowdsec_db_password]
        networks: [crowdsec-net]
        deploy:
            update_config: {failure_action: rollback, order: stop-first}
            restart_policy: {delay: 10s}
            placement: {constraints: [node.labels.tier == database]}
            resources: {limits: {memory: 256M}}
        healthcheck: {test: [CMD-SHELL, 'pg_isready -U crowdsec'], timeout: 5s, start_period: 30s}

volumes:
    config: {driver_opts: {type: none, o: bind, device: /data/crowdsec}}
    data: {driver_opts: {type: none, o: bind, device: /data/crowdsec/data}}
    crowdsec_db: {driver_opts: {type: none, o: bind, device: /data/crowdsec/db}}

configs:
    file_env: {name: crowdsec_file_env_v1, file: ../_shared/file-env.sh}
    waitfor: {name: crowdsec_waitfor_v1, file: ../_shared/waitfor.sh}
    config_local: {name: crowdsec_config_local_v1, file: ./config.yaml.local}
    acquis: {name: crowdsec_acquis_v1, file: ./acquis.yaml}
    appsec: {name: crowdsec_appsec_v2, file: ./appsec.yaml}
    profiles: {name: crowdsec_profiles_v1, file: ./profiles.yaml}
    notification_http: {name: crowdsec_notification_http_v1, file: ./notification-http.yaml}
    console: {name: crowdsec_console_v1, file: ./console.yaml}

secrets:
    crowdsec_db_password: {name: crowdsec_db_password_v1, external: true}
    crowdsec_bouncer_key_traefik: {name: crowdsec_bouncer_key_traefik_v1, external: true}

networks:
    crowdsec-net: {driver: overlay}
    crowdsec-proxy: {driver: overlay}
    crowdsec-bouncer: {name: crowdsec-bouncer, driver: overlay}
