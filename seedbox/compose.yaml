services:
    gluetun:
        image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
        container_name: gluetun
        restart: unless-stopped
        environment:
            VPN_SERVICE_PROVIDER: protonvpn
            VPN_TYPE: wireguard
            TZ: Europe/Paris
            SERVER_COUNTRIES: Netherlands,Spain
            PORT_FORWARD_ONLY: on
            VPN_PORT_FORWARDING: on
            VPN_PORT_FORWARDING_UP_COMMAND: >-
                /bin/sh -c 'wget -O- --retry-connrefused --post-data
                "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
                http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
        cap_add: [NET_ADMIN]
        devices: ['/dev/net/tun:/dev/net/tun']
        ports: ['8080:8080']
        volumes: ['gluetun-data:/gluetun']
        secrets: [wireguard_private_key]
        sysctls: [net.ipv6.conf.all.disable_ipv6=1]
        mem_limit: 256M
        healthcheck: {start_period: 90s}

    qbittorrent:
        image: linuxserver/qbittorrent:5.3.0@sha256:afed7399d0f336ee22d6d011b3c8c50a44e3810f0af6e3c4083d79e566f1677a
        container_name: qbittorrent
        restart: unless-stopped
        network_mode: 'service:gluetun'
        depends_on: {gluetun: {condition: service_healthy, restart: true}}
        environment:
            TZ: Europe/Paris
            PUID: 1000
            PGID: 1000
            WEBUI_PORT: 8080
        volumes: ['qbittorrent-config:/config', '/mnt/jellyfin/downloads:/downloads']
        mem_limit: 1G

volumes:
    gluetun-data: {name: seedbox_gluetun-data}
    qbittorrent-config: {name: seedbox_qbittorrent-config}

secrets:
    wireguard_private_key: {file: /etc/docker-secrets/seedbox_wg_private_key}
