on:
  push:
    branches-ignore: [main]
    paths:
      - "authelia/**"
      - ".forgejo/workflows/authelia.yml"

name: Authelia

concurrency:
  group: authelia-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  validate-config:
    name: Validate config
    runs-on: nixos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate configuration with the deployed image
        run: |
          image=$(grep -oE 'authelia/authelia:[^[:space:]]+' authelia/compose.yaml)
          echo "Image : $image"
          secrets=$(mktemp -d)
          podman run --rm -v "$secrets:/keys" "docker.io/$image" authelia crypto pair rsa generate --directory /keys > /dev/null
          mv "$secrets/private.pem" "$secrets/authelia_oidc_jwks_key"
          podman run --rm \
            -v "$PWD/authelia/configuration.yml:/config/configuration.yml:ro" \
            -v "$PWD/authelia/assets:/config/assets:ro"
            -v "$secrets:/run/secrets:ro" \
            -e X_AUTHELIA_CONFIG_FILTERS=template \
            -e AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET="x$(printf '%063d' 0)" \
            -e AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET="x$(printf '%063d' 0)" \
            -e AUTHELIA_SESSION_SECRET="x$(printf '%063d' 0)" \
            -e AUTHELIA_STORAGE_ENCRYPTION_KEY="x$(printf '%063d' 0)" \
            -e AUTHELIA_STORAGE_POSTGRES_PASSWORD=x \
            -e AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD=x \
            "docker.io/$image" authelia validate-config --config /config/configuration.yml
            rm -r "$secrets"
