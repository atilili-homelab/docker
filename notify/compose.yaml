x-deploy: &deploy
    placement: {constraints: [node.labels.tier == apps]}
    resources: {limits: {memory: 256M}}
    update_config: {order: start-first, failure_action: rollback}
    rollback_config: {order: start-first}
    restart_policy: {delay: 10s}

services:
    ntfy:
        image: binwiederhier/ntfy:v2.38@sha256:ca35419d29a834824db2440fa9320897fbe40b026c5fc2360c76ed3501b5e716
        entrypoint: [/file-env.sh, ntfy]
        command: [serve]
        env_file: [./ntfy.env]
        environment:
            PGPASSWORD_FILE: /run/secrets/ntfy_db_password
            NTFY_WEB_PUSH_PUBLIC_KEY_FILE: /run/secrets/ntfy_public_key
            NTFY_WEB_PUSH_PRIVATE_KEY_FILE: /run/secrets/ntfy_private_key
        volumes: ['ntfy_attachments:/var/cache/ntfy/attachments']
        configs: [{source: file_env, target: /file-env.sh, mode: 0555}]
        secrets: [ntfy_db_password, ntfy_public_key, ntfy_private_key]
        networks: [traefik-wan, ntfy-net]
        deploy:
            !!merge <<: *deploy
            labels:
                traefik.enable: 'true'
                traefik.swarm.network: traefik-wan
                traefik.http.routers.ntfy.rule: Host(`ntfy.macopla.com`)
                traefik.http.services.ntfy.loadbalancer.server.port: 80
        healthcheck:
            timeout: 5s
            start_period: 20s
            test: [CMD-SHELL, 'wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo ''"healthy"\s*:\s*true'' || exit 1']

    apprise:
        image: caronc/apprise:2.1.0@sha256:bd7dc73b75882326b97d2963b7c3dd2a5e033df27d84c51f0090465d583fb316
        environment:
            TZ: Europe/Paris
            APPRISE_STATEFUL_MODE: simple
            APPRISE_WORKER_COUNT: 1
            APPRISE_ADMIN: n
        volumes: ['apprise_config:/config', 'apprise_attach:/attach']
        networks: [traefik-lan, ntfy-net]
        deploy:
            !!merge <<: *deploy
            labels:
                traefik.enable: 'true'
                traefik.swarm.network: traefik-lan
                traefik.http.routers.apprise.rule: Host(`apprise.macopla.com`)
                traefik.http.services.apprise.loadbalancer.server.port: 8000
                traefik.http.routers.apprise.middlewares: lan-sso@file
        healthcheck: {test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8000/status >/dev/null || exit 1'], timeout: 5s, start_period: 20s}

    ntfy-db:
        image: postgres:18.7-trixie@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
        labels: {backup.db.engine: postgres, backup.db.user: ntfy}
        environment:
            POSTGRES_USER: ntfy
            POSTGRES_DB: ntfy
            POSTGRES_PASSWORD_FILE: /run/secrets/ntfy_db_password
        secrets: [ntfy_db_password]
        volumes: ['ntfy_db:/var/lib/postgresql']
        networks: [ntfy-net]
        deploy:
            placement: {constraints: [node.labels.tier == database]}
            update_config: {order: stop-first, failure_action: rollback}
            restart_policy: {delay: 10s}
            resources: {limits: {memory: 256M}}
        healthcheck: {test: [CMD-SHELL, 'pg_isready -U ntfy -d ntfy'], timeout: 5s, start_period: 20s}

volumes:
    ntfy_attachments: {driver_opts: {type: none, o: bind, device: /data/ntfy/attachments}}
    ntfy_db: {driver_opts: {type: none, o: bind, device: /data/ntfy/db}}
    apprise_config: {driver_opts: {type: none, o: bind, device: /data/apprise/config}}
    apprise_attach: {driver_opts: {type: none, o: bind, device: /data/apprise/attachments}}

configs:
    file_env: {name: ntfy_file_env_v1, file: ../_shared/file-env.sh}

secrets:
    ntfy_db_password: {name: ntfy_db_password_v1, external: true}
    ntfy_public_key: {name: ntfy_web_push_public_key_v1, external: true}
    ntfy_private_key: {name: ntfy_web_push_private_key_v1, external: true}

networks:
    traefik-wan: {external: true}
    traefik-lan: {external: true}
    ntfy-net: {driver: overlay}
