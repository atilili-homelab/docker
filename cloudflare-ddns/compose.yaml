services:
    cloudflare-ddns:
        image: favonia/cloudflare-ddns:1.18.0@sha256:345b41895a8846d74c62d30bd27e61101a754f8ab8da10c68115823883803afb
        environment:
            TZ: Europe/Paris
            CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare_ddns_api_token
            DOMAINS: macopla.com,*.macopla.com,mail.macopla.com
            IP6_PROVIDER: none
            SHOUTRRR: generic://apprise.macopla.com/notify/apprise?template=json&messagekey=body&$$tag=infra-warning
        secrets: [cloudflare_ddns_api_token]
        volumes:
        - type: tmpfs
          target: /tmp
          tmpfs: {size: 5242880, mode: 1777}
        read_only: true
        deploy:
            placement: {constraints: [node.labels.tier == infra]}
            resources: {limits: {memory: 32M}}
            update_config: {failure_action: rollback, order: stop-first}
            restart_policy: {delay: 10s}

secrets:
    cloudflare_ddns_api_token: {external: true}
