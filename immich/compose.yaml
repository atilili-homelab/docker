x-deploy: &deploy
    update_config: {failure_action: rollback, order: stop-first}
    restart_policy: {delay: 10s}
    resources: {limits: {memory: 1024M}}

services:
    immich-server:
        image: altran1502/immich-server:v3.4.1@sha256:7c489add298fc2f92cda4c777de6462aa206877e04087b815f62c7664af0b53b
        entrypoint: [tini, --, /waitfor.sh, 'immich-db:5432', 'immich-redis:6379', --, /bin/bash, -c]
        command: [start.sh]
        environment:
            TZ: Europe/Paris
            DB_HOSTNAME: immich-db
            DB_USERNAME: immich
            DB_PASSWORD_FILE: /run/secrets/immich_db_password
            DB_DATABASE_NAME: immich
            REDIS_HOSTNAME: immich-redis
            REDIS_PASSWORD_FILE: /run/secrets/immich_redis_password
            IMMICH_CONFIG_FILE: /config/immich.yml
            IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
            IMMICH_HELMET_FILE: 'true'
        secrets: [immich_db_password, immich_redis_password, immich_oidc_client_secret, immich_smtp_password]
        volumes: ['immich-upload:/usr/src/app/upload']
        configs:
        - {source: config, target: /config/immich.yml}
        - {source: waitfor, target: /waitfor.sh, mode: 0555}
        networks: [traefik-wan, immich-net]
        user: '33:33'
        cap_drop: [NET_RAW]
        deploy:
            !!merge <<: *deploy
            placement: {constraints: [node.labels.tier == apps]}
            labels:
                traefik.enable: 'true'
                traefik.swarm.network: traefik-wan
                traefik.http.routers.immich.rule: Host(`photo.macopla.com`)
                traefik.http.services.immich.loadbalancer.server.port: 2283
        healthcheck: {test: [CMD, immich-healthcheck], timeout: 5s, start_period: 60s}

    immich-machine-learning:
        image: altran1502/immich-machine-learning:v3.4.1@sha256:8adebf414256f6e4f837bfbb66fa94f14f4da7260e3a1d65cbba49e4e35d8764
        environment:
            TZ: Europe/Paris
            TRANSFORMERS_CACHE: /cache
            HUGGING_FACE_HUB_CACHE: /cache
            MPLCONFIGDIR: /cache/matplotlib
            MACHINE_LEARNING_MODEL_REVISION: v2
        volumes: ['immich-ml-cache:/cache']
        networks: [immich-net]
        user: '33:33'
        cap_drop: [NET_RAW]
        deploy:
            !!merge <<: *deploy
            placement: {constraints: [node.labels.tier == apps]}

    immich-redis:
        image: valkey/valkey:9@sha256:13010f40f0623c52f0d3527a48bbf059870e6864b4eee642cdabad3f5e240e69
        command: /bin/sh -c "valkey-server --requirepass $$(cat /run/secrets/immich_redis_password)"
        secrets: [immich_redis_password]
        volumes: ['immich-redis_redis:/data']
        networks: [immich-net]
        user: '999:999'
        cap_drop: [NET_RAW]
        deploy:
            !!merge <<: *deploy
            placement: {constraints: [node.labels.tier == database]}
            resources: {limits: {memory: 256M}}
        healthcheck:
            timeout: 5s
            start_period: 60s
            test: ['CMD-SHELL', 'valkey-cli -a "$$(cat /run/secrets/immich_redis_password)" --no-auth-warning ping | grep -q PONG']

    immich-db:
        image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3@sha256:828081a755d3911a2d94f0a2be9f98570c07d52cf080fd310a9d6e4b83b73aa5
        labels: {backup.db.engine: postgres, backup.db.user: immich}
        environment:
            POSTGRES_USER: immich
            POSTGRES_DB: immich
            POSTGRES_PASSWORD_FILE: /run/secrets/immich_db_password
            POSTGRES_INITDB_ARGS: --data-checksums
        secrets: [immich_db_password]
        volumes: ['immich_db:/var/lib/postgresql', {type: tmpfs, target: /dev/shm, tmpfs: {size: 134217728}}]
        networks: [immich-net]
        user: '999:999'
        cap_drop: [NET_RAW]
        deploy:
            !!merge <<: *deploy
            placement: {constraints: [node.labels.tier == database]}
        healthcheck: {test: [CMD-SHELL, 'pg_isready -U immich -d immich'], timeout: 5s, start_period: 60s}

volumes:
    immich-upload: {driver_opts: {type: nfs, o: 'addr=nas.macopla.home,nfsvers=4', device: ':/mnt/tank/immich/data/upload'}}
    immich-ml-cache: {}
    immich-redis_redis: {driver_opts: {type: none, o: bind, device: /data/immich/redis}}
    immich_db: {driver_opts: {type: none, o: bind, device: /data/immich/db}}

configs:
    config: {name: immich_config_v1, file: ./config.yml, template_driver: golang}
    waitfor: {name: immich_waitfor_v1, file: ../_shared/waitfor.sh}

secrets:
    immich_db_password: {name: immich_db_password_v1, external: true}
    immich_redis_password: {name: immich_redis_password_v1, external: true}
    immich_oidc_client_secret: {name: immich_oidc_client_secret_v1, external: true}
    immich_smtp_password: {name: immich_smtp_password_v1, external: true}

networks:
    traefik-wan: {external: true}
    immich-net: {driver: overlay}
