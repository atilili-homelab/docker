services:
    vaultwarden:
        image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
        read_only: true
        env_file: [./vaultwarden.env]
        volumes: ['vaultwarden_data:/data', {type: tmpfs, target: /tmp}]
        configs: [{source: database_url, target: /run/configs/db_url}]
        secrets:
        - vaultwarden_admin_token
        - vaultwarden_oidc_client_secret
        - vaultwarden_db_password
        - vaultwarden_smtp_password
        - vaultwarden_push_installation_key
        networks: [traefik-wan, vaultwarden-net]
        deploy:
            update_config: {failure_action: rollback, order: stop-first}
            restart_policy: {delay: 10s}
            resources: {limits: {memory: 128M}}
            placement: {constraints: [node.labels.tier == infra]}
            labels:
                traefik.enable: 'true'
                traefik.swarm.network: traefik-wan
                traefik.http.routers.vaultwarden.rule: Host(`vault.macopla.com`)
                traefik.http.services.vaultwarden.loadbalancer.server.port: 80
                # Panneau d'administration : LAN uniquement (règle plus longue, donc prioritaire)
                traefik.http.routers.vaultwarden-admin.rule: Host(`vault.macopla.com`) && PathPrefix(`/admin`)
                traefik.http.routers.vaultwarden-admin.middlewares: lan@file
                traefik.http.routers.vaultwarden-admin.service: vaultwarden
        healthcheck: {test: curl -f http://127.0.0.1:80/alive || exit 1, timeout: 10s, start_period: 10s}

    vaultwarden-db:
        image: postgres:18.7-trixie@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        environment:
            POSTGRES_USER: vaultwarden
            POSTGRES_DB: vaultwarden
            POSTGRES_PASSWORD_FILE: /run/secrets/vaultwarden_db_password
        volumes: ['vaultwarden_db:/var/lib/postgresql']
        secrets: [vaultwarden_db_password]
        networks: [vaultwarden-net]
        deploy:
            update_config: {failure_action: rollback, order: stop-first}
            restart_policy: {delay: 10s}
            resources: {limits: {memory: 256M}}
            placement: {constraints: [node.labels.tier == database]}
        healthcheck: {test: [CMD-SHELL, pg_isready -U vaultwarden -d vaultwarden], timeout: 10s, start_period: 10s}

volumes:
    vaultwarden_data: {driver_opts: {type: none, o: bind, device: /data/vaultwarden}}
    vaultwarden_db: {driver_opts: {type: none, o: bind, device: /data/vaultwarden/db}}

configs:
    database_url: {name: vaultwarden_db_url_v1, file: ./db_url.tmpl, template_driver: golang}

secrets:
    vaultwarden_admin_token: {name: vaultwarden_admin_token_v1, external: true}
    vaultwarden_oidc_client_secret: {name: vaultwarden_oidc_client_secret_v1, external: true}
    vaultwarden_db_password: {name: vaultwarden_db_password_v1, external: true}
    vaultwarden_smtp_password: {name: vaultwarden_smtp_password_v1, external: true}
    vaultwarden_push_installation_key: {name: vaultwarden_push_installation_key_v1, external: true}

networks:
    traefik-wan: {external: true}
    vaultwarden-net: {driver: overlay, attachable: true}
