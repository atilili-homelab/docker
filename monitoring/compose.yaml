x-deploy: &deploy
    update_config: {failure_action: rollback, order: stop-first}
    restart_policy: {delay: 10s}

x-global: &global
    mode: global
    update_config: {delay: 10s, failure_action: rollback, order: stop-first}
    restart_policy: {delay: 10s}

x-healthcheck: &healthcheck {timeout: 10s, retries: 5, start_period: 30s}

x-socket-proxy: &socket-proxy
    image: linuxserver/socket-proxy:3.4.8-r0-ls107@sha256:6beb1743581ec3b2ed1a2bafd617e8c7a1d7ae2fe835293e333327618fc2b925
    volumes: ['/var/run/docker.sock:/var/run/docker.sock:ro', {type: tmpfs, target: /run}]
    read_only: true
    environment:
        TZ: Europe/Paris
        NETWORKS: 1
        SERVICES: 1
        TASKS: 1
        NODES: 1
        CONTAINERS: 1
        INFO: 1
        SWARM: 1
    networks: [monitor-socket-proxy]
    # Alloy interroge le proxy de son propre nœud par l'IP de l'hôte (NODE_FQDN:2378)
    ports: [{target: 2375, published: 2378, mode: host}]
    healthcheck:
        test: wget --no-verbose --tries=1 --spider http://127.0.0.1:2375/version || exit 1
        timeout: 5s
        start_period: 5s

services:
    monitor-socket-proxy-worker:
        !!merge <<: *socket-proxy
        deploy:
            !!merge <<: *global
            placement: {constraints: [node.role == worker]}
            resources: {limits: {memory: 32M}}

    monitor-socket-proxy-manager:
        !!merge <<: *socket-proxy
        deploy:
            !!merge <<: *global
            placement: {constraints: [node.role == manager]}
            resources: {limits: {memory: 32M}}

    prometheus:
        image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
        environment: {TZ: Europe/Paris}
        command:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=30d
        - --storage.tsdb.retention.size=8GB
        configs:
        - {source: prometheus_config, target: /etc/prometheus/prometheus.yml}
        - {source: prometheus_rules_pve, target: /etc/prometheus/pve-rules.yml}
        - {source: prometheus_rules_container, target: /etc/prometheus/container-rules.yml}
        volumes: ['prometheus:/prometheus']
        networks: [monitor-socket-proxy, monitoring-net, traefik-lan]
        stop_grace_period: 2m
        deploy:
            !!merge <<: *deploy
            update_config: {monitor: 6m, failure_action: rollback, order: stop-first}
            placement: {constraints: [node.labels.tier == monitor]}
            resources: {limits: {memory: 2048M, cpus: '2.0'}, reservations: {memory: 512M}}
            labels:
                traefik.enable: 'true'
                traefik.swarm.network: traefik-lan
                traefik.http.routers.prometheus.rule: Host(`prom.macopla.com`)
                traefik.http.routers.prometheus.middlewares: lan-sso@file
                traefik.http.services.prometheus.loadbalancer.server.port: 9090
        healthcheck:
            !!merge <<: *healthcheck
            test: wget --spider -q http://127.0.0.1:9090/-/healthy || exit 1
            start_period: 3m

    alloy:
        image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
        user: root
        environment:
            TZ: Europe/Paris
            NODE_NAME: '{{.Node.Hostname}}'
            NODE_FQDN: '{{.Node.Hostname}}.macopla.home'
        command:
        - run
        - --server.http.listen-addr=0.0.0.0:12345
        - --storage.path=/var/lib/alloy/data
        - /etc/alloy/config.alloy
        configs: [{source: alloy_config, target: /etc/alloy/config.alloy}]
        volumes:
        - {type: bind, source: /var/lib/docker/containers, target: /var/lib/docker/containers, read_only: true}
        - {type: bind, source: /var/log/journal, target: /var/log/journal, read_only: true}
        - 'alloy-data:/var/lib/alloy/data'
        networks: [monitoring-net]
        deploy:
            !!merge <<: *global
            update_config: {delay: 10s, monitor: 1m, failure_action: rollback, order: stop-first}
            resources: {limits: {memory: 320M, cpus: '0.5'}, reservations: {memory: 128M}}
        healthcheck:
            !!merge <<: *healthcheck
            test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/12345']

    loki:
        image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
        environment: {TZ: Europe/Paris}
        command: [-config.file=/etc/loki/loki.yml]
        configs: [{source: loki_config, target: /etc/loki/loki.yml}]
        volumes: ['loki:/loki']
        networks: [monitoring-net, traefik-lan]
        stop_grace_period: 1m
        deploy:
            !!merge <<: *deploy
            placement: {constraints: [node.labels.tier == monitor]}
            resources: {limits: {memory: 1024M, cpus: '1.0'}, reservations: {memory: 256M}}
            labels:
                traefik.enable: 'true'
                traefik.swarm.network: traefik-lan
                traefik.http.routers.loki-push.rule: Host(`loki.macopla.com`) && PathPrefix(`/loki/api/v1/push`)
                traefik.http.routers.loki-push.middlewares: lan@file
                traefik.http.services.loki-push.loadbalancer.server.port: 3100

    grafana:
        image: grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
        entrypoint: [/waitfor.sh, 'grafana-db:5432', --, /run.sh]
        env_file: [./grafana.env]
        secrets:
        - grafana_db_password
        - grafana_admin_password
        - gatus_push_token
        - grafana_oidc_client_secret
        configs:
        - {source: grafana_datasources, target: /etc/grafana/provisioning/datasources/datasources.yml}
        - {source: grafana_alerting, target: /etc/grafana/provisioning/alerting/alerting.yml}
        - {source: grafana_alert_rules, target: /etc/grafana/provisioning/alerting/rules.yml}
        - {source: waitfor, target: /waitfor.sh, mode: 0555}
        volumes: ['grafana:/var/lib/grafana']
        # traefik-lan sert aussi à joindre notify_apprise en direct (voir grafana-alerting.yml)
        networks: [monitoring-net, grafana-db-net, traefik-lan]
        deploy:
            !!merge <<: *deploy
            update_config: {monitor: 3m, failure_action: rollback, order: start-first}
            rollback_config: {order: start-first}
            placement: {constraints: [node.labels.tier == monitor]}
            resources: {limits: {memory: 1024M, cpus: '1.0'}, reservations: {memory: 256M}}
            labels:
                traefik.enable: 'true'
                traefik.swarm.network: traefik-lan
                traefik.http.routers.grafana.rule: Host(`grafana.macopla.com`)
                traefik.http.routers.grafana.middlewares: lan@file
                traefik.http.services.grafana.loadbalancer.server.port: 3000
        healthcheck:
            !!merge <<: *healthcheck
            test: wget --spider -q http://127.0.0.1:3000/api/health || exit 1
            start_period: 60s

    grafana-db:
        image: postgres:18.7-trixie@sha256:a47637053e65dc7112aeb7353feb8b87954982ad5fd4524908c284d90d71b5e3
        labels: {backup.db.engine: postgres, backup.db.user: grafana}
        environment:
            POSTGRES_USER: grafana
            POSTGRES_DB: grafana
            POSTGRES_PASSWORD_FILE: /run/secrets/grafana_db_password
        secrets: [grafana_db_password]
        volumes: ['grafana-db:/var/lib/postgresql']
        networks: [grafana-db-net]
        deploy:
            !!merge <<: *deploy
            placement: {constraints: [node.labels.tier == database]}
            resources: {limits: {memory: 256M}, reservations: {memory: 64M}}
        healthcheck:
            !!merge <<: *healthcheck
            test: [CMD-SHELL, 'pg_isready -U grafana -d grafana']
            timeout: 5s

    pve-exporter:
        image: prompve/prometheus-pve-exporter:3.12.0@sha256:e49466559449074596e762dd09c9a76c9be9b6a1ffacf7bc8ceb827169cb180e
        secrets: [{source: pve_exporter_config, target: /etc/prometheus/pve.yml}]
        networks: [monitoring-net]
        deploy:
            !!merge <<: *deploy
            placement: {constraints: [node.labels.tier == monitor]}
            resources: {limits: {memory: 128M}, reservations: {memory: 32M}}

    node-exporter:
        image: prom/node-exporter:v1.13.1@sha256:7296504d4ada44b7d7ab4431e27e9f9900d8488f8d55842f4b12ae2704e16dfe
        command: [--path.rootfs=/host, --path.procfs=/host/proc, --path.sysfs=/host/sys]
        volumes: [{type: bind, source: /, target: /host, read_only: true, bind: {propagation: rslave}}]
        networks: [monitoring-net]
        ports: [{target: 9100, published: 9100, mode: host}]
        deploy:
            !!merge <<: *global
            resources: {limits: {memory: 256M}, reservations: {memory: 128M}}
        healthcheck:
            !!merge <<: *healthcheck
            test: wget --spider -q http://127.0.0.1:9100/ || exit 1

    cadvisor:
        image: ghcr.io/google/cadvisor:v0.61.1@sha256:4929b70e82079d001d0028b85d6a4dd25ad4666b719455c9542b983489963916
        command:
        - --docker_only=true
        - --housekeeping_interval=15s
        - --disable_metrics=advtcp,disk,percpu,sched,tcp,udp,diskIO,hugetlb,referenced_memory,resctrl,cpu_topology
        - --store_container_labels=false
        - --whitelisted_container_labels=com.docker.swarm.service.name,com.docker.stack.namespace,com.docker.compose.project,com.docker.compose.service
        volumes: ['/:/rootfs:ro', '/var/run:/var/run:ro', '/sys:/sys:ro', '/var/lib/docker/:/var/lib/docker:ro']
        networks: [monitoring-net]
        deploy:
            !!merge <<: *global
            resources: {limits: {memory: 256M, cpus: '0.5'}, reservations: {memory: 128M}}
        healthcheck:
            !!merge <<: *healthcheck
            test: wget --spider -q http://127.0.0.1:8080/healthz || exit 1

configs:
    prometheus_config: {name: monitoring_prometheus_config_v14, file: ./prometheus.yml}
    prometheus_rules_pve: {name: monitoring_prometheus_rules_pve_v4, file: ./pve-rules.yml}
    prometheus_rules_container: {name: monitoring_prometheus_rules_container_v3, file: ./container-rules.yml}
    grafana_datasources: {name: monitoring_grafana_datasources_v2, file: ./grafana-datasources.yml}
    grafana_alerting: {name: monitoring_grafana_alerting_v4, file: ./grafana-alerting.yml}
    grafana_alert_rules: {name: monitoring_grafana_alert_rules_v4, file: ./grafana-alert-rules.yml}
    loki_config: {name: monitoring_loki_config_v1, file: ./loki.yml}
    alloy_config: {name: monitoring_alloy_config_v4, file: ./config.alloy}
    waitfor: {name: monitoring_waitfor_v1, file: ../_shared/waitfor.sh}

secrets:
    pve_exporter_config: {name: pve_exporter_config_v1, external: true}
    grafana_db_password: {name: grafana_db_password_v1, external: true}
    grafana_admin_password: {name: grafana_admin_password_v1, external: true}
    grafana_oidc_client_secret: {name: grafana_oidc_client_secret_v1, external: true}
    gatus_push_token: {name: gatus_push_token_v1, external: true}

volumes:
    prometheus: {driver_opts: {type: none, o: bind, device: /data/local/prometheus}}
    grafana: {driver_opts: {type: none, o: bind, device: /data/local/grafana}}
    grafana-db: {driver_opts: {type: none, o: bind, device: /data/grafana/db}}
    loki: {driver_opts: {type: none, o: bind, device: /data/local/loki}}
    alloy-data: {}

networks:
    monitor-socket-proxy: {driver: overlay}
    monitoring-net: {driver: overlay}
    grafana-db-net: {driver: overlay}
    traefik-lan: {external: true}
